[package]
name = "tectonics-sim"
version = "0.1.0"
edition = "2024"
description = "Plate tectonics simulation core, compiled to WASM for the browser worker"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[features]
# Spread the per-cell passes over every core with rayon. In the browser this
# needs the threaded build (`npm run build:wasm:threads`) and a cross-origin
# isolated page.
parallel = ["dep:rayon", "dep:wasm-bindgen-rayon"]

[dependencies]
indexmap = { version = "2.14.2", features = ["serde"] }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
rayon = { version = "1.12.0", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.129"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-rayon = { version = "1.3.0", optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.wasm-pack.profile.release]
wasm-opt = [
  "-O3",
  "--enable-simd",
  "--enable-bulk-memory",
  "--enable-nontrapping-float-to-int",
  "--enable-sign-ext",
  "--enable-mutable-globals",
  "--enable-multivalue",
  "--enable-reference-types",
  "--enable-threads",
]
